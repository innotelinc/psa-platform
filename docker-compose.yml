services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psa-platform
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - psa-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
    restart: unless-stopped

volumes:
  psa-data:
