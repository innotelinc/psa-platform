services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DATE: ${GIT_DATE:-}
        GIT_DESCRIBE: ${GIT_DESCRIBE:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: psa-platform
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - psa-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - OAUTH_REDIRECT_BASE=https://psa.innotel.us
    restart: unless-stopped

volumes:
  psa-data:
